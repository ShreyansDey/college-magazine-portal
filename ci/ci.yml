# ci/ci.yml - GitHub Actions CI Workflow template
# To activate in GitHub, copy or move this file to .github/workflows/ci.yml
# Note: Ensure your Git token has the 'workflow' scope enabled.

name: CI Test & Validate

on:
  push:
    branches: [ "main", "development" ]
  pull_request:
    branches: [ "main", "development" ]

jobs:
  test:
    name: Run Test Suite & Contract Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run automated pytest suite
        run: |
          pytest -v

      - name: Validate all interactive editions (Hard Collar contract)
        run: |
          python tools/validate_edition.py --all
